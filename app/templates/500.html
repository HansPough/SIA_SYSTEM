{% extends 'base.html' %}
{% block title %}Server error{% endblock %}
{% block content %}
<div class="card">
  <h1>Something went wrong</h1>
  <p>The error was written to <code>instance/error.log</code>.</p>
  <p class="muted">After an update, run <code>python scripts/check_setup.py</code> and restart
  <code>python run.py</code>.</p>
  <div class="actions">
    <a class="btn primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
    <a class="btn ghost" href="{{ url_for('auth.login') }}">Log in again</a>
  </div>
</div>
{% endblock %}
