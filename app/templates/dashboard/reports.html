{% extends 'base.html' %}
{% import '_macros.html' as m %}
{% block title %}Reports{% endblock %}
{% block content %}
<div class="page-head"><h1>Reports</h1></div>
<div class="cards">
{% for key, (title, text) in reports.items() %}
  <a class="tile" href="{{ url_for('dashboard.report', name=key) }}"><h3>{{ title }}</h3><p>{{ text }}</p></a>
{% endfor %}
</div>
<p class="note">Filter any report and download it as CSV.</p>
{% endblock %}
